# ==============================================================================
# BankX Banking Core — Application Configuration (Local Profile)
# ==============================================================================

server:
  port: 8091

spring:
  application:
    name: bankx-banking-core

  # ============================================================================
  # Database — PostgreSQL 16
  # QUAN TRỌNG: ddl-auto=validate → Flyway quản lý schema, KHÔNG để create/update
  # ============================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/bankx_db
    username: bankx_user
    password: bankx_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BankX-HikariPool
      maximum-pool-size: 20          # Tối đa 20 connections (tăng dần theo load)
      minimum-idle: 5
      connection-timeout: 30000      # 30s timeout khi lấy connection
      idle-timeout: 600000           # 10 phút idle trước khi đóng
      max-lifetime: 1800000          # 30 phút max lifetime của connection
      leak-detection-threshold: 60000 # Cảnh báo nếu connection giữ > 60s

  jpa:
    hibernate:
      ddl-auto: validate             # CHỈ validate schema, KHÔNG tự động tạo/sửa
    show-sql: false                  # Tắt SQL log trong prod (bật ở dev nếu cần debug)
    open-in-view: false              # Tắt OSIV — Tránh N+1 query ngoài ý muốn
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20             # Batch insert performance
          time_zone: UTC             # Lưu timestamp ở UTC, convert khi hiển thị

  # ============================================================================
  # Flyway — Database Migration (Bật sau khi đã có migration files)
  # ============================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false              # KHÔNG cho phép chạy migration không theo thứ tự

  # ============================================================================
  # Redis — OTP, Idempotency, Rate Limit, Cache, Session
  # ============================================================================
  data:
    redis:
      host: localhost
      port: 6379
      password: bankx_redis_password
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

  # ============================================================================
  # Kafka — Outbox Pattern event publishing + Notification consuming
  # ============================================================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                      # Đảm bảo message được ghi vào tất cả replicas
      retries: 3
      properties:
        enable.idempotence: true     # Kafka producer idempotency
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: bankx-banking-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bankx.*"

# ============================================================================
# Actuator — Metrics + Health
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local

# ============================================================================
# OpenTelemetry — Gửi traces về Jaeger
# ============================================================================
  tracing:
    sampling:
      probability: 1.0               # Capture 100% traces trong dev (giảm xuống 0.1 trong prod)

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
  service:
    name: ${spring.application.name}

# ============================================================================
# OpenAPI / Swagger
# ============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ============================================================================
# BankX Custom Configuration
# ============================================================================
bankx:
  # JWT — Phải khớp với Gateway config
  jwt:
    secret: "bankx-super-secret-key-for-development-only-change-in-production-minimum-256-bits"
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

  # Transfer Business Rules (configurable, không hard-code trong code)
  transfer:
    max-amount-per-transaction: 200000000     # 200 triệu VND
    max-amount-per-day: 500000000             # 500 triệu VND
    otp-required-threshold: 5000000           # >= 5 triệu → cần OTP
    idempotency-ttl-minutes: 10

  # OTP
  otp:
    length: 6
    ttl-seconds: 120
    max-attempts: 3
    block-duration-minutes: 5

  # Rate Limiting
  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 1
    transfer:
      max-per-minute: 10

  # Outbox Poller
  outbox:
    polling-interval-ms: 1000
    batch-size: 50
    max-retry: 5

# ============================================================================
# Logging — Structured logging với MDC (traceId, userId tự động inject)
# ============================================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{userId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.bankx: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN           # Tắt SQL log — bật DEBUG nếu cần debug query
